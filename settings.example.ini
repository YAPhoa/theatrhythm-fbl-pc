# Copy to settings.ini and change what you need. Environment variables in parentheses override a key.
# A settings.ini in the save folder is read instead of the one next to the game; the in-game pages
# save there.
# Window: windowed, borderless (covers the screen at the desktop resolution) or fullscreen
# (THEATRHYTHM_DISPLAY_MODE); size when windowed, screen mode in fullscreen (THEATRHYTHM_WINDOW).
display_mode=borderless
window=1920x1080
# Display index the window opens on, empty for the primary (THEATRHYTHM_MONITOR).
monitor=
# VSync (THEATRHYTHM_VSYNC): 1 waits for the monitor; 0 shows the newest frame at each refresh,
# still without tearing (some drivers hold that to twice the refresh rate).
vsync=1
# With vsync=0: 1 shows each frame at once, tearing allowed: the least input delay and no frame rate
# ceiling (THEATRHYTHM_TEARING). README "Advanced settings".
tearing=0
# Present limit in FPS (30, 60, 100, 120, 144, 180, 240), 0 = the display's
# refresh rate (one frame per refresh), unlimited = none
# (pair it with vsync=0 and tearing=1 for an uncapped frame rate).
fps_limit=0
# Compile shaders on worker threads (THEATRHYTHM_ASYNC_SHADERS).
async_shaders=1
# Frames a draw may stay unseen while its shader compiles before the game waits for it; 0 always
# waits, -1 never does (the draw is missing until the compile ends) (THEATRHYTHM_ASYNC_SHADERS_SKIP_FRAMES).
async_shaders_skip_frames=1
# Frames the GPU thread may queue: 1, 2 or 0 for unbounded (THEATRHYTHM_FRAMES_AHEAD).
frames_queued=1
# Forced anisotropic filtering: 0 (the game's own), 2, 4, 8, 16 (THEATRHYTHM_ANISOTROPY).
anisotropy=0
# Render resolution: 4k (the PS4 Pro's 3840x2160, filtered down to the window or desktop resolution:
# sharper on any screen) or 1080p (the PS4's, lighter on the GPU). Applies at the next start
# (THEATRHYTHM_RENDER_RESOLUTION).
render_resolution=4k
# Audio: volume 0-200 % (THEATRHYTHM_AUDIO_VOLUME); speakers auto, stereo, 5.1, 7.1 (THEATRHYTHM_AUDIO_CHANNELS).
master_volume=100
audio_channels=auto
# Controller vibration 0-100 % (THEATRHYTHM_VIBRATION).
vibration=100
# Local players: 1, 2 or auto (THEATRHYTHM_PLAYERS). 2 offers the game a second user on a second
# gamepad (the keyboard stays with player 1); auto does that when two gamepads are connected at
# start, and plays with one otherwise.
players=auto
# Button remapping, comma-separated <ps4 button>=<source> (README "Controls"): the first mention of
# a button replaces its defaults, the next ones add, =None clears it. Gamepad sources are SDL button
# names (a b x y back start leftshoulder ...) (THEATRHYTHM_PAD_MAP); keyboard sources are SDL key
# names or Mouse Left/Right/Middle/X1/X2, and lstick_up ... rstick_right are mappable (THEATRHYTHM_KEY_MAP).
# Example: key_map=cross=G,cross=Mouse Left,triangle=Y
pad_map=
key_map=
# 1: Circle confirms in the save and text dialogs, Cross cancels (THEATRHYTHM_MENU_CONFIRM_SWAP).
menu_confirm_swap=0
# 1: start straight at the title screen, without the start-up logos and the opening movie; the setup's
# checkbox sets it (THEATRHYTHM_SKIP_OPENING).
skip_opening=0
# Button icons in the game's prompts (THEATRHYTHM_BUTTON_ICONS): auto follows the device last used
# (PlayStation pad, other pad, keyboard); ps4 (the game's own), xbox or keyboard keep one set.
# The Live Info controller follows it: an Xbox pad for xbox, the DualShock 4 otherwise.
button_icons=auto
